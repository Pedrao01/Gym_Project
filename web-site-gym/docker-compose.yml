services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

  gym-web:
    build: .
    container_name: web-site-gym
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file: .env

  celery-beat:
    build: .
    container_name: celery-beat-gym
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file: .env

  celery-work:
    build: .
    container_name: celery-work-gym
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file: .env

  nginx:
    image: nginx:alpine
    container_name: nginx_gym
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - frontend_dist:/app/frontend:ro
    depends_on:
      - gym-web

  frontend-builder:
    build: ../gym-frontend
    volumes:
      - frontend_dist:/app/dist

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  frontend_dist: