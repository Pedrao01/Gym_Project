name: CI - Testing and Quality (Django)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.4'
          cache: 'pip'

      - name: Install dependencies
        working-directory: web-site-gym
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the .env file from the secrets and varibles
        working-directory: web-site-gym
        run: |
          cat << EOF > .env
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ vars.DB_HOST  }}
          DB_PORT=${{ vars.DB_PORT }}
          DJANGO_SETTINGS_MODULE=${{ vars.DJANGO_SETTINGS_MODULE }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ vars.DEBUG }}
          ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          BACK_URL=${{ vars.BACK_URL }}
          MERCADOPAGO_ACCESS_TOKEN=${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}

      - name: spin up the database using docker-compose
        working-directory: web-site-gym
        run: docker compose up -d db

      - name: Wait for the database to be finished
        working-directory: web-site-gym
        run: |
          until docker compose exec -T db pg_isready -U postgres; do
            echo "Waiting the database"
            sleep 1
          done

      - name: Install linting tools
        working-directory: web-site-gym
        run: pip install flake8 black isort

      - name: Run lint and formatting
        working-directory: web-site-gym
        run: |
          flake8 . 
          black --check .
          isort --check-only .

      - name: Check migrations pending
        working-directory: web-site-gym
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        working-directory: web-site-gym
        run: pytest --cov=. --cov-report=term-missing

      - name: Knocks down the containers
        working-directory: web-site-gym
        if: always()
        run: docker compose down
